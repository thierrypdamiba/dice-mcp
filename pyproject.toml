[project]
name = "dice"
version = "1.0.0"
description = "A minimal, well-typed dice-rolling MCP server (roll_dice) for AI agents."
requires-python = ">=3.10"
dependencies = [
    "arcade-mcp-server>=1.17.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "arcade-mcp[all]>=1.14.4,<2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

# Tell Arcade.dev that this package exposes Arcade tools.
[project.entry-points.arcade_toolkits]
dice = "dice"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false
